name: Frontend & Shared Tests

on:
  push:
    branches: [dev]
    paths:
      - 'shared/**'
      - 'mobile/**'
      - 'tests/**'
  pull_request:
    branches: [dev]
    paths:
      - 'shared/**'
      - 'mobile/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Updated to match project version found in previous steps (net9.0)

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test tests/SportsBettingAnalyzer.Tests --no-build --verbosity normal
