name: Frontend & Shared Tests

on:
  push:
    branches: [master, dev]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'mobile/**'
      - 'tests/**'
  pull_request:
    branches: [master, dev]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'mobile/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build frontend (net9.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build frontend/SportsBettingAnalyzer.csproj --nologo

  test-shared:
    name: Run shared tests (net10.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/SportsBettingAnalyzer.Tests --verbosity normal
