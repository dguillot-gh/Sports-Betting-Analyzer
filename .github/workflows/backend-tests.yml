name: Backend Tests

on:
  push:
    branches: [dev, master]
    paths:
      - 'backend/**'
  pull_request:
    branches: [dev, master]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install pytest httpx anyio

      - name: Run all backend tests
        working-directory: .
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres # Placeholder for app.py import
        run: |
          python -m pytest backend/tests/ -v --tb=short
