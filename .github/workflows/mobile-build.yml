name: Build and Release Mobile APK

on:
  push:
    branches: [ master, main, develop, development ]
    paths:
      - 'mobile/**'
      - 'shared/**'
  pull_request:
    branches: [ master, main, develop, development ]
    paths:
      - 'mobile/**'
      - 'shared/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_VERSION: 9.0.x

jobs:
  build-android:
    # Skip on PRs from forks: their secrets aren't available
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest  # MAUI Android builds
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android workload
      run: dotnet workload install android

    - name: Restore dependencies
      run: dotnet restore mobile/SportsBettingAnalyzer.Mobile.csproj

    - name: Generate Version
      id: version-gen
      run: |
        $commitCount = [int](git rev-list --count HEAD)
        $date = Get-Date -Format "yyyy.MM.dd"
        $version = "$date.$commitCount"
        $shortSha = git rev-parse --short HEAD
        $branch = $env:GITHUB_REF_NAME

        # Monotonic version code from commit count
        $versionCode = $commitCount * 100

        $out = $env:GITHUB_OUTPUT
        "version=$version"        | Out-File -FilePath $out -Append
        "version_code=$versionCode" | Out-File -FilePath $out -Append
        "git_sha=$shortSha"       | Out-File -FilePath $out -Append
        "git_branch=$branch"      | Out-File -FilePath $out -Append
        "build_time=$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')" | Out-File -FilePath $out -Append

        Write-Host "Generated version: $version (code: $versionCode)"
      shell: powershell

    - name: Update Android Manifest Version
      run: |
        $projectPath = "mobile/SportsBettingAnalyzer.Mobile.csproj"
        $version = $env:VERSION
        $versionCode = [int]$env:VERSION_CODE

        [xml]$projectXml = Get-Content -Raw $projectPath
        foreach ($pg in $projectXml.Project.PropertyGroup) {
          if ($pg.ApplicationDisplayVersion) {
            $pg.ApplicationDisplayVersion = $version
            $pg.ApplicationVersion = $versionCode.ToString()
          }
        }
        $projectXml.Save($projectPath)
        Write-Host "Updated Android version to: $version (code: $versionCode)"
      env:
        VERSION: ${{ steps.version-gen.outputs.version }}
        VERSION_CODE: ${{ steps.version-gen.outputs.version_code }}
      shell: powershell

    - name: Restore Signing Keystore
      if: ${{ env.KEYSTORE_B64 != '' }}
      run: |
        $bytes = [Convert]::FromBase64String($env:KEYSTORE_B64)
        [IO.File]::WriteAllBytes("keystore.keystore", $bytes)
        Write-Host "Restored keystore.keystore (${bytes.Length} bytes)"
      shell: powershell

    - name: Build Android APK
      run: |
        $publishArgs = @(
          '-c', 'Release',
          '-f', 'net9.0-android',
          '-p:AndroidPackageFormat=apk'
        )
        if ($env:HAS_KEYSTORE -eq 'true') {
          $publishArgs += @(
            '-p:AndroidKeyStore=true',
            '-p:AndroidSigningKeyStore=keystore.keystore',
            '-p:AndroidSigningKeyAlias=SportsBettingAnalyzer',
            '-p:AndroidSigningKeyPassword=$env:KEY_PASSWORD',
            '-p:AndroidSigningStorePassword=$env:STORE_PASSWORD'
          )
          Write-Host "Signing release APK with release keystore"
        } else {
          Write-Host "No keystore secret configured - building debug-signed (installable) APK"
        }
        dotnet publish 'mobile/SportsBettingAnalyzer.Mobile.csproj' $publishArgs
      shell: powershell

    - name: Locate APK
      id: apk
      shell: powershell
      run: |
        $apk = Get-ChildItem -Recurse -Path mobile/bin -Filter *.apk | Select-Object -First 1
        if (-not $apk) { Write-Error "No APK produced by publish step"; exit 1 }
        "path=$($apk.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "APK: $($apk.FullName)"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sports-betting-analyzer-android
        path: ${{ steps.apk.outputs.path }}
        retention-days: 90

    - name: Create GitHub Release
      if: >
        (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
        || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
      uses: softprops/action-gh-release@v2
      with:
        name: "Sports Betting Analyzer v${{ steps.version-gen.outputs.version }}"
        tag_name: "v${{ steps.version-gen.outputs.version }}"
        body: |
          ## Sports Betting Analyzer Mobile App v${{ steps.version-gen.outputs.version }}

          ### 📱 Installation
          1. Download the APK below
          2. Allow "Install from unknown sources" on your Android device
          3. Install the APK

          ### 📝 What's in this build
          - Real-time sports betting analysis
          - ML predictions (NASCAR, NFL, NBA, NCAAB)
          - Live odds tracking and bet tracking

          ### 🔧 Build Information
          - **Version**: ${{ steps.version-gen.outputs.version }}
          - **Git SHA**: ${{ steps.version-gen.outputs.git_sha }}
          - **Branch**: ${{ steps.version-gen.outputs.git_branch }}
          - **Build Time**: ${{ steps.version-gen.outputs.build_time }}
          - **Signing**: ${{ env.HAS_KEYSTORE == 'true' && 'release' || 'debug' }}

          > Analysis tool - provides estimates, not guaranteed outcomes.
        files: ${{ steps.apk.outputs.path }}
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build for iOS (requires macOS runner)
  build-ios:
    if: false # Disabled by default - enable when you have an Apple Developer account
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install MAUI Workloads
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore mobile/SportsBettingAnalyzer.Mobile.csproj

    - name: Build iOS
      run: |
        dotnet publish mobile/SportsBettingAnalyzer.Mobile.csproj `
          -c Release `
          -f net9.0-ios `
          -p:RuntimeIdentifier=ios-arm64 `
          -p:ArchiveOnBuild=true `
          -p:CodesignEntitlements=mobile/Platforms/iOS/Entitlements.plist `
          -p:CodesignProvision=${{ secrets.IOS_PROVISIONING_PROFILE }} `
          -p:CodesignSigner=${{ secrets.IOS_CERTIFICATE }} `
          -p:CodesignPassword=${{ secrets.IOS_CERTIFICATE_PASSWORD }}
