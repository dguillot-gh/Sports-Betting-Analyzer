name: Build and Deploy Mobile App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - 'shared/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'shared/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'
        type: boolean

env:
  DOTNET_VERSION: 9.0.x

jobs:
  build-android:
    runs-on: windows-latest  # Windows is required for MAUI Android builds
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Restore dependencies
      run: |
        dotnet restore mobile/SportsBettingAnalyzer.Mobile.csproj
        
    - name: Generate Version
      id: version-gen
      run: |
        # Generate semantic version based on date and commit count
        $commitCount = git rev-list --count HEAD
        $date = Get-Date -Format "yyyy.MM.dd"
        $version = "$date.$commitCount"
        $shortSha = git rev-parse --short HEAD
        $branch = $env:GITHUB_REF_NAME
        
        Write-Output "version=$version" >> $env:GITHUB_OUTPUT
        Write-Output "git_sha=$shortSha" >> $env:GITHUB_OUTPUT
        Write-Output "git_branch=$branch" >> $env:GITHUB_OUTPUT
        Write-Output "build_time=$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')" >> $env:GITHUB_OUTPUT
        
        Write-Host "Generated version: $version"
        Write-Host "Git SHA: $shortSha"
        Write-Host "Branch: $branch"
      shell: powershell
        
    - name: Update Android Manifest Version
      run: |
        # Update version in the project file
        $projectPath = "mobile/SportsBettingAnalyzer.Mobile.csproj"
        $version = "${{ steps.version-gen.outputs.version }}"
        $versionParts = $version -split '\.'
        $majorVersion = $versionParts[0]
        $minorVersion = $versionParts[1]
        $patchVersion = $versionParts[2]
        
        # Calculate Android version code (major * 1000000 + minor * 10000 + patch * 100)
        $versionCode = [int]$majorVersion * 1000000 + [int]$minorVersion * 10000 + [int]$patchVersion * 100
        
        [xml]$projectXml = Get-Content $projectPath
        $propertyGroup = $projectXml.Project.PropertyGroup | Where-Object { $_.ApplicationDisplayVersion }
        $propertyGroup.ApplicationDisplayVersion = $version
        $propertyGroup.ApplicationVersion = $versionCode.ToString()
        
        $projectXml.Save($projectPath)
        
        Write-Host "Updated Android version to: $version (code: $versionCode)"
      shell: powershell
        
    - name: Build Android APK
      run: |
        dotnet publish mobile/SportsBettingAnalyzer.Mobile.csproj `
          -c Release `
          -f net9.0-android `
          -p:AndroidPackageFormat=apk `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore=keystore.keystore `
          -p:AndroidSigningKeyAlias=SportsBettingAnalyzer `
          -p:AndroidSigningKeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }} `
          -p:AndroidSigningStorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} `
          --self-contained
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sports-betting-analyzer-android
        path: |
          mobile/bin/Release/net9.0-android/publish/*.apk
        retention-days: 30
        
    - name: Create GitHub Release
      if: github.event.inputs.release == 'true' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
      uses: softprops/action-gh-release@v2
      with:
        name: "Sports Betting Analyzer v${{ steps.version-gen.outputs.version }}"
        tag_name: "v${{ steps.version-gen.outputs.version }}"
        body: |
          ## Sports Betting Analyzer Mobile App v${{ steps.version-gen.outputs.version }}
          
          ### 🚀 Features
          - Real-time sports betting analysis
          - Machine learning predictions
          - Live odds tracking
          - Bet tracking and analytics
          
          ### 📱 Installation
          1. Download the APK below
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK
          
          ### 🔧 Build Information
          - **Version**: ${{ steps.version-gen.outputs.version }}
          - **Git SHA**: ${{ steps.version-gen.outputs.git_sha }}
          - **Branch**: ${{ steps.version-gen.outputs.git_branch }}
          - **Build Time**: ${{ steps.version-gen.outputs.build_time }}
          - **Environment**: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          
          ### ⚠️ Requirements
          - Android 7.0 (API level 24) or higher
          - Internet connection for backend services
          
        files: |
          mobile/bin/Release/net9.0-android/publish/*.apk
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/main' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build for iOS (requires macOS runner)
  build-ios:
    if: false # Disabled by default - enable when you have Apple Developer account
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install MAUI Workloads
      run: |
        dotnet workload install maui
        
    - name: Restore dependencies
      run: |
        dotnet restore mobile/SportsBettingAnalyzer.Mobile.csproj
        
    - name: Build iOS
      run: |
        dotnet publish mobile/SportsBettingAnalyzer.Mobile.csproj `
          -c Release `
          -f net9.0-ios `
          -p:RuntimeIdentifier=ios-arm64 `
          -p:ArchiveOnBuild=true `
          -p:CodesignEntitlements=mobile/Platforms/iOS/Entitlements.plist `
          -p:CodesignProvision=${{ secrets.IOS_PROVISIONING_PROFILE }} `
          -p:CodesignSigner=${{ secrets.IOS_CERTIFICATE }} `
          -p:CodesignPassword=${{ secrets.IOS_CERTIFICATE_PASSWORD }}
